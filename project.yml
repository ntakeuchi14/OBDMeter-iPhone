name: OBDMeter
options:
  bundleIdPrefix: com.ntakeuchi14
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OBDMeter:
    type: application
    platform: iOS
    sources:
      - path: OBDMeter
    info:
      path: OBDMeter/Info.plist
      properties:
        CFBundleDisplayName: OBDMeter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: OBD アダプター (Bluetooth LE) と通信するために使います
        NSLocalNetworkUsageDescription: Wi-Fi の OBD アダプターと通信するために使います
        NSMotionUsageDescription: 端末の傾き・加速度を表示するために使います
        UIBackgroundModes:
          - bluetooth-central
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntakeuchi14.obdmeter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        SWIFT_STRICT_CONCURRENCY: minimal
